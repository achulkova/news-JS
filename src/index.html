<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header class="site-header">
            <div class="brand">
                <span class="brand__eyebrow">Daily briefing</span>
                <h1>News Portal</h1>
            </div>
            <p class="header__tagline">Stories worth your attention</p>
        </header>
        <main>
            <section class="source-panel" aria-labelledby="sources-heading">
                <div class="section-heading">
                    <span class="section-heading__number">01</span>
                    <h2 id="sources-heading">Choose a source</h2>
                </div>
                <div class="sources buttons" role="list" aria-label="News sources"></div>
            </section>
            <p class="app-status" role="status" aria-live="polite">Select a source to read the latest stories.</p>
            <div class="news"></div>
        </main>
        <footer class="site-footer">
            <p class="copyright">
                © 2026 News Portal · Data by <a href="https://newsapi.org" rel="noopener">NewsAPI</a>
            </p>
            <a href="https://github.com/achulkova" target="_blank" rel="noopener noreferrer">Author GitHub</a>
            <a
                class="course-logo"
                href="https://rs.school/courses/javascript"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" />
            </a>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <img class="news__meta-photo" src="" alt="" />
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
